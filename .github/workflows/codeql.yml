name: CodeQL

# AISDLC-840 (DEC-0161): advanced CodeQL setup replacing GitHub default setup.
# AISDLC-934 (DEC-0250): no pull_request trigger. Every push to main and a weekly
# schedule scan all four languages; a pull request starts no CodeQL run, which
# saves the repository Actions token bucket during a drain.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC

permissions: read-all

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go, javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          category: /language:${{ matrix.language }}
