# AISDLC-833 (DEC-0206): posts the `ai-sdlc/attestation` commit status and the
# DEC-0065 approving review for the verdict recorded by the `attestation-gate`
# job of ai-sdlc-gate.yml. This workflow is the write-token half of the split:
# it fires on `workflow_run` (so it always runs the DEFAULT-branch definition
# with a write token, including for fork PRs) and runs NO PR code. The only
# PR-influenced input is the verdict artifact, treated as data: validated, then
# passed through env, never interpolated into a script.
name: Attestation post

on:
  workflow_run:
    workflows: ['AI-SDLC PR Ready Gate']
    types: [completed]

permissions:
  contents: read

jobs:
  post:
    name: Post attestation status
    # Only for PR runs. A cancelled gate run (newer push) records no verdict
    # and must not post (AISDLC-412), so skip cancelled conclusions.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      actions: read
    steps:
      # Base-defined scripts only: the default branch, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download attestation verdict
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation-verdict
          path: verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate verdict and post status
        id: post
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("verdict/verdict.json", "utf8"));
            const bad = (m) => { console.error("::error::" + m); process.exit(1); };
            if (!/^[0-9a-f]{40}$/.test(v.headSha || "")) bad("invalid head sha in verdict");
            if (v.headSha !== process.env.RUN_HEAD_SHA) bad("verdict head sha does not match the workflow run");
            if (!/^[0-9]+$/.test(String(v.prNumber || ""))) bad("invalid PR number in verdict");
            if (!/^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/.test(v.headRepo || "")) bad("invalid head repo in verdict");
            const status = String(v.status || "");
            const reason = String(v.reason || "").replace(/[\r\n]+/g, " ");
            let state, desc;
            if (status === "release-please") { state = "success"; desc = "release-please version bump — attestation N/A"; }
            else if (status === "valid") { state = "success"; desc = reason.slice(0, 130) || "valid envelope at HEAD"; }
            else if (!status) { state = "failure"; desc = "verifier crashed before emitting result — see workflow logs"; }
            else { state = "failure"; desc = reason.slice(0, 130); }
            const out = { state, desc, headSha: v.headSha, prNumber: String(v.prNumber), headRepo: v.headRepo, prUrl: /^https:\/\/github\.com\//.test(v.prUrl || "") ? v.prUrl : "", status, reason };
            fs.writeFileSync("verdict/clean.json", JSON.stringify(out));
            const o = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(o, "state=" + state + "\nhead_sha=" + out.headSha + "\npr_number=" + out.prNumber + "\nhead_repo=" + out.headRepo + "\nstatus=" + status + "\n");
          '
          STATE=$(node -p 'require("./verdict/clean.json").state')
          DESC=$(node -p 'require("./verdict/clean.json").desc')
          PR_URL=$(node -p 'require("./verdict/clean.json").prUrl')
          HEAD_SHA=$(node -p 'require("./verdict/clean.json").headSha')
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -X POST \
            -f state="$STATE" \
            -f context='ai-sdlc/attestation' \
            -f description="$DESC" \
            ${PR_URL:+-f target_url="$PR_URL"}
          echo "Posted ai-sdlc/attestation: $STATE on $HEAD_SHA"

      # AISDLC-747 (DEC-0065): APPROVE review for a verified attestation, same-repo
      # heads only (never forks). Needs the repo setting "Allow GitHub Actions to
      # create and approve pull requests"; a 403 fails naming that setting.
      - name: Post approving review
        if: steps.post.outputs.status == 'valid' && steps.post.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.post.outputs.pr_number }}
          HEAD_SHA: ${{ steps.post.outputs.head_sha }}
          HEAD_REPO: ${{ steps.post.outputs.head_repo }}
          STATUS: ${{ steps.post.outputs.status }}
        run: |
          if [ ! -f scripts/post-attestation-review.mjs ]; then
            echo "::notice::scripts/post-attestation-review.mjs not on the base yet; skipping"
            exit 0
          fi
          REASON=$(node -p 'require("./verdict/clean.json").reason') node scripts/post-attestation-review.mjs
