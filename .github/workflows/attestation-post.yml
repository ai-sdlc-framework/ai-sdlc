# AISDLC-833 (DEC-0206): posts the `ai-sdlc/attestation` commit status and the
# DEC-0065 approving review for the verdict recorded by the `attestation-gate`
# job of ai-sdlc-gate.yml. This workflow is the write-token half of the split:
# it fires on `workflow_run` (so it always runs the DEFAULT-branch definition
# with a write token, including for fork PRs) and runs NO PR code. The only
# PR-influenced input is the head envelope, read through the GitHub API as DATA only. The verdict is
# RE-COMPUTED here by running scripts/verify-attestation.mjs from the default
# branch; the PR-controlled gate run's artifacts are never read, so a fork PR
# cannot forge the posted state or the DEC-0065 approving review.
name: Attestation post

on:
  workflow_run:
    workflows: ['AI-SDLC PR Ready Gate']
    types: [completed]

permissions:
  contents: read

jobs:
  post:
    name: Post attestation status
    # Only for PR runs. A cancelled gate run (newer push) records no verdict
    # and must not post (AISDLC-412), so skip cancelled conclusions.
    # AISDLC-927: the gate run-name marks draft and dependabot runs (attestation
    # job skipped); those start no runner and make no API call. Docs-only skips
    # still resolve through the jobs check below.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      !contains(github.event.workflow_run.display_title, '[no-attestation]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      actions: read
    steps:
      # Base-defined scripts only: the default branch, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # The gate job skips docs-only, draft and dependabot PRs (no status then).
      # Only whether it ran is taken from the gate run; never its verdict.
      - name: Check the attestation gate ran
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Attestation gate")) | .conclusion' | head -n1)
          echo "attestation-gate conclusion: ${CONCLUSION:-none}"
          if [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "skipped" ] || [ "$CONCLUSION" = "cancelled" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage head envelope (DATA-ONLY, GitHub API; no fetch or checkout of the head)
        if: steps.gate.outputs.ran == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/stage-attestation-data-api.sh

      # Same-repo release-please branches only; a fork with that prefix is verified.
      - name: Detect release-please PR
        id: release_please
        if: steps.gate.outputs.ran == 'true'
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO_FULL: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
        run: |
          IS_RP=false
          case "${HEAD_REF:-}" in
            release-please--*) [ "$HEAD_REPO_FULL" = "$REPO" ] && IS_RP=true ;;
          esac
          echo "is_release_please=${IS_RP}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.ran == 'true' && steps.release_please.outputs.is_release_please != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.ran == 'true' && steps.release_please.outputs.is_release_please != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build the verifier (default-branch code)
        if: steps.gate.outputs.ran == 'true' && steps.release_please.outputs.is_release_please != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@ai-sdlc/orchestrator..." build

      # workflow_run.pull_requests is empty for fork PRs, so the base SHA is
      # resolved from the API by head SHA (trusted: the base repo's own PR record).
      - name: Resolve PR base SHA
        id: base
        if: steps.gate.outputs.ran == 'true' && steps.release_please.outputs.is_release_please != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail
          BASE="${EVENT_BASE_SHA:-}"
          if [ -z "$BASE" ]; then
            BASE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              --jq '[.[] | select(.base.repo.full_name == "'"${REPO}"'" and .head.sha == "'"${HEAD_SHA}"'")] | sort_by(.number) | reverse | .[0].base.sha // empty')
          fi
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the PR base sha for ${HEAD_SHA}"; exit 1
          fi
          echo "base_sha=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Verify attestation
        id: verify
        if: steps.gate.outputs.ran == 'true' && steps.release_please.outputs.is_release_please != 'true'
        continue-on-error: true
        env:
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: node scripts/verify-attestation.mjs

      - name: Validate verdict and post status
        id: post
        if: steps.gate.outputs.ran == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          IS_RELEASE_PLEASE: ${{ steps.release_please.outputs.is_release_please }}
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          VERIFY_REASON: ${{ steps.verify.outputs.reason }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const e = process.env;
            const bad = (m) => { console.error("::error::" + m); process.exit(1); };
            if (!/^[0-9a-f]{40}$/.test(e.RUN_HEAD_SHA || "")) bad("invalid head sha in workflow run");
            if (!/^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/.test(e.RUN_HEAD_REPO || "")) bad("invalid head repo in workflow run");
            const prNumber = /^[0-9]+$/.test(e.RUN_PR_NUMBER || "") ? e.RUN_PR_NUMBER : "";
            const status = e.IS_RELEASE_PLEASE === "true" ? "release-please" : String(e.VERIFY_STATUS || "");
            const reason = String(e.VERIFY_REASON || "").replace(/[\r\n]+/g, " ");
            let state, desc;
            if (status === "release-please") { state = "success"; desc = "release-please version bump — attestation N/A"; }
            else if (status === "valid") { state = "success"; desc = reason.slice(0, 130) || "valid envelope at HEAD"; }
            else if (!status) { state = "failure"; desc = "verifier crashed before emitting result — see workflow logs"; }
            else { state = "failure"; desc = reason.slice(0, 130); }
            const out = { state, desc, headSha: e.RUN_HEAD_SHA, prNumber, headRepo: e.RUN_HEAD_REPO, status, reason };
            fs.writeFileSync("clean.json", JSON.stringify(out));
            fs.appendFileSync(e.GITHUB_OUTPUT, "state=" + state + "\nhead_sha=" + out.headSha + "\npr_number=" + out.prNumber + "\nhead_repo=" + out.headRepo + "\nstatus=" + status + "\n");
          '
          STATE=$(node -p 'require("./clean.json").state')
          DESC=$(node -p 'require("./clean.json").desc')
          HEAD_SHA=$(node -p 'require("./clean.json").headSha')
          ARGS=(-X POST -f state="$STATE" -f context='ai-sdlc/attestation' -f description="$DESC")
          PR_NUM=$(node -p 'require("./clean.json").prNumber')
          if [ -n "$PR_NUM" ]; then
            ARGS+=(-f target_url="https://github.com/${REPO}/pull/${PR_NUM}")
          fi
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" "${ARGS[@]}"
          echo "Posted ai-sdlc/attestation: $STATE on $HEAD_SHA"

      # AISDLC-747 (DEC-0065): APPROVE review for a verified attestation, same-repo
      # heads only (never forks). Needs the repo setting "Allow GitHub Actions to
      # create and approve pull requests"; a 403 fails naming that setting.
      - name: Post approving review
        if: steps.post.outputs.status == 'valid' && steps.post.outputs.pr_number != '' && github.event.workflow_run.head_repository.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.post.outputs.pr_number }}
          HEAD_SHA: ${{ steps.post.outputs.head_sha }}
          HEAD_REPO: ${{ steps.post.outputs.head_repo }}
          STATUS: ${{ steps.post.outputs.status }}
        run: |
          if [ ! -f scripts/post-attestation-review.mjs ]; then
            echo "::notice::scripts/post-attestation-review.mjs not on the base yet; skipping"
            exit 0
          fi
          REASON=$(node -p 'require("./clean.json").reason') node scripts/post-attestation-review.mjs
