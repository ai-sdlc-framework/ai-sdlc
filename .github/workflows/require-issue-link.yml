# require-issue-link.yml — AISDLC-443
#
# Posts `ai-sdlc/issue-link` as a status check on every PR.
# Status is SUCCESS when the PR body or title contains a GitHub-linked-issue
# reference (Closes/Fixes/Resolves #N, or cross-repo org/repo#N form), or when
# the PR is tied to a backlog task (AISDLC-700): its diff touches a file under
# backlog/tasks/ or backlog/completed/, or its title carries an existing task
# id as `(AISDLC-N)`. The description names which rule passed.
# Status is FAILURE when none of these is found. The decision logic lives in
# scripts/issue-link-decision.mjs.
#
# BYPASS: label `ci:no-issue-required` on the PR skips the check
# (status posts SUCCESS immediately). Intended for:
#   - release-please rolling PRs
#   - dependabot bumps
#   - self-evident maintainer chores
#
# This is an INFORMATIONAL status check — it is NOT a required branch-
# protection check by default. Operators who want to enforce the policy
# hard should wire `ai-sdlc/issue-link` into required branch-protection
# checks via:
#   gh api -X PATCH repos/<org>/<repo>/branches/main/protection/required_status_checks \
#     -F 'contexts[]=ai-sdlc/issue-link' ...
# (See CONTRIBUTING.md §Issue-first workflow for the full rationale.)
#
# EDGE CASES handled (AC #5):
#   - Cross-repo references:  Closes org/repo#123
#   - Multiple references:    body may contain several Closes/Fixes/Resolves lines
#   - PR title references:    both title and body are scanned
#   - Case-insensitive:       closes, CLOSES, Fixes, FIXES, Resolves, RESOLVES
#   - GitHub short forms:     #N (bare hash-prefixed number in Closes context)

name: Require Linked Issue

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-issue-link:
    name: ai-sdlc/issue-link
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    # Skip when the PR is a draft — informational only on draft PRs.
    if: github.event.pull_request.draft == false
    steps:
      # pull_request_target checks out the BASE ref, never PR code. Only the
      # decision script and the task-file listing are needed (AISDLC-700).
      - name: Checkout base (decision script + task listing)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/issue-link-decision.mjs
            backlog/tasks
            backlog/completed
          persist-credentials: false

      - name: Check for linked issue, backlog task or bypass label
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Changed paths from the API (adds, modifies, moves — renames list
          # both the new and previous path). PR text stays in env vars above.
          PR_FILES=$(gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          export PR_FILES

          # scripts/issue-link-decision.mjs owns every rule (bypass label, linked
          # issue, backlog task by diff, backlog task by title id) and is unit
          # tested under `pnpm test`.
          DECISION=$(node scripts/issue-link-decision.mjs)
          STATE=$(printf '%s' "$DECISION" | jq -r '.state')
          RULE=$(printf '%s' "$DECISION" | jq -r '.rule')
          DESCRIPTION=$(printf '%s' "$DECISION" | jq -r '.description')
          TARGET_URL=$(printf '%s' "$DECISION" | jq -r '.targetUrl')
          [ -n "$TARGET_URL" ] || TARGET_URL="https://github.com/$REPO/pull/$PR_NUMBER"

          echo "result=$STATE" >> "$GITHUB_OUTPUT"
          echo "[require-issue-link] rule=$RULE state=$STATE ($DESCRIPTION)"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="ai-sdlc/issue-link" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
