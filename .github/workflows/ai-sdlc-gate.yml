name: AI-SDLC PR Ready Gate

# AISDLC-140 sub-1 — single rollup status check `ai-sdlc/pr-ready` that
# aggregates every PR signal AI-SDLC adopters need into ONE branch-protection
# entry. Replaces the historical pattern of enumerating N required checks by
# name + app_id (Pattern A in /tmp/research-prior-art.md), which is brittle
# against path filters, [skip ci] tokens, matrix changes, and multi-app
# posters (see `docs/operations/quality-gate.md` for the full rationale).
#
# Adopter promise: configure ONE required check (`ai-sdlc/pr-ready`) on your
# protected branch and you get the framework's full CI rollup for free —
# regardless of which workflows happen to fire on a given PR.
#
# Architecture: this workflow is the ONLY required check after cutover (sub-3).
# Today it runs ADDITIVELY alongside the legacy required checks (`CI OK`,
# `Post Review Results`, `codecov/patch`, `ai-sdlc/attestation`); the cutover
# is an operator action documented in `docs/operations/quality-gate.md`.
#
# Q-decisions baked in (per /tmp/quality-gate-redesign-final.md):
#  - Q1: prescriptive default for adopters from day one
#  - Q2: GHMQ-agnostic — same workflow handles `pull_request` + `merge_group`
#  - Q3: attestation is audit-only — `ai-sdlc/attestation` is NOT in the
#        aggregator's required signal set; it feeds into this rollup
#        indirectly per AISDLC-388 per-archetype logic (see below)
#  - Q4(b): this workflow IS the framework's prescriptive default; will be
#          scaffolded by `init` in sub-5
#
# Per-archetype attestation gating (AISDLC-388):
#
#   docs-only PRs (every changed file in spec/rfcs/**, docs/**,
#   backlog/{tasks,completed}/**, or root *.md):
#     → build-test, integration are SKIPPED (already gated by `detect`)
#     → `ai-sdlc/attestation` is NOT required; the attestation-gate job is skipped
#     → pr-ready aggregator passes via alls-green treating skipped as allowed
#
#   code/mixed PRs (at least one non-docs file):
#     → build-test, integration all required (existing behavior)
#     → the attestation-gate job runs the DSSE verifier and posts
#       `ai-sdlc/attestation`; a missing/invalid envelope fails the job and so
#       `ai-sdlc/pr-ready` (branch protection requires only `ai-sdlc/pr-ready`)
#
# Operator action required: after this PR lands, update branch protection on
# `main` to require ONLY `ai-sdlc/pr-ready` (remove `ai-sdlc/attestation`
# as a direct required check). See docs/operations/quality-gate.md for the
# exact `gh api` command and cutover procedure (AISDLC-388 AC-2).
#
# Industry pattern: `re-actors/alls-green` ("alls-green") is the de facto
# community fix; named adopters include aiohttp, attrs, conda, setuptools,
# pytest, pip-tools, Open edX, PyCA, PyPA, Mergify. Load-bearing detail
# (per /tmp/research-prior-art.md): naive `needs:` alone reports `skipped`
# (which auto-merge treats as success). `re-actors/alls-green` with
# `if: always()` and `needs` introspection is the canonical fix.

on:
  pull_request:
    # AISDLC-218 (revised): keep `opened` (so direct-ready PRs fire the gate)
    # AND add `ready_for_review` (canonical fire-once trigger when a draft
    # flips to ready). The job-level `if: !draft` guards (detect job + pr-ready
    # rollup) skip draft opens, so the original 2-CI-runs-per-draft-PR problem
    # AISDLC-218 fixed doesn't recur.
    types: [opened, synchronize, reopened, ready_for_review]
  # AISDLC-400 (2026-05-23): merge_group trigger removed. The GitHub merge queue
  # was dropped; PRs now merge directly via auto-merge (squash) once required
  # checks on the PR head pass. There are no merge-queue probe SHAs to gate
  # against. Rollback: restore the merge_group trigger here and re-enable the
  # merge queue in Settings → Branches → main. See
  # docs/operations/merge-without-queue.md.

# One in-flight gate run per PR; cancel superseded runs. AISDLC-876: a
# `ready_for_review` event is the draft-to-ready flip on an UNCHANGED head SHA,
# so it must not cancel the run already in flight (it queues behind it instead);
# only head-changing events (opened, synchronize, reopened) cancel.
concurrency:
  group: ai-sdlc-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}

permissions:
  contents: read

jobs:
  # ── Archetype detection ─────────────────────────────────────────────────
  # AISDLC-484: `docs_only` is computed by `scripts/is-docs-only-changeset.mjs`
  # (the single source of truth shared with `ai-sdlc-review.yml`) fed the PR's changed-file list. The former
  # dorny docs_only filter step (quantifier "every") never fired in
  # production, so every docs PR ran the full matrix. The `deps` and `tasks`
  # outputs still come from dorny filters (default `some` quantifier).
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    # AISDLC-218: skip on draft PRs. Subsequent jobs `needs: detect` so this
    # cascades — a draft event causes no jobs to run at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      deps: ${{ steps.deps-filter.outputs.deps }}
      tasks: ${{ steps.tasks-filter.outputs.tasks }}
      python: ${{ steps.sdk-filter.outputs.python }}
      go: ${{ steps.sdk-filter.outputs.go }}
      first_run: ${{ steps.sdk-filter.outputs.first_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base SHA is present for `git diff`.
          fetch-depth: 0
      - name: Classify changeset
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail safe: any inability to compute the PR diff resolves to
          # docs_only=false (run the full matrix), never true.
          if [ -n "$BASE_SHA" ]; then
            if FILES=$(git -c core.quotePath=false diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
              RESULT=$(printf '%s\n' "$FILES" | node scripts/is-docs-only-changeset.mjs)
            else
              echo "::warning::git diff failed; treating changeset as not docs-only"
              RESULT=false
            fi
          else
            # Non-PR event (no base SHA): classify every tracked file.
            RESULT=$(git -c core.quotePath=false ls-files | node scripts/is-docs-only-changeset.mjs)
          fi
          if [ "$RESULT" != "true" ]; then RESULT=false; fi
          echo "docs_only=$RESULT" >> "$GITHUB_OUTPUT"
      # Second filter (default `some` quantifier): true when the PR touches
      # dependency manifests OR GitHub Actions workflows/composite actions.
      # Drives the dependency-review-gate job — covers npm + github-actions
      # bumps (incl. Dependabot) against the GitHub Advisory DB.
      - id: deps-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            deps:
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'package-lock.json'
              - 'yarn.lock'
              - '.github/workflows/**'
              - '.github/actions/**'
      # Third filter (AISDLC-712.1): true when the PR adds or edits a task file.
      # The pattern is EXACTLY the `paths:` trigger of dor-ingress.yml, so this
      # output is true if and only if the "Evaluate backlog tasks changed by PR"
      # check is going to run. Drives the dor-readiness-gate job.
      - id: tasks-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tasks:
              - 'backlog/tasks/*.md'
      # Fourth filter (AISDLC-727): SDK + first-run-smoke path filters moved
      # here from ci.yml so this workflow is the only one that runs the suite
      # on pull_request events.
      - id: sdk-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - 'sdk-python/**'
              - 'conformance/**'
            go:
              - 'sdk-go/**'
              - 'conformance/**'
            first_run:
              - 'ai-sdlc-plugin/**'
              - 'orchestrator/src/cli/commands/init*'
              - 'orchestrator/src/cli/commands/doctor*'
              - 'orchestrator/src/cli/commands/init-templates.ts'
              - 'scripts/first-run-smoke*'

  # ── Lint & Format (code/mixed only) ─────────────────────────────────────
  # AISDLC-879: skipped on docs-only PRs (`lint` is in the rollup's
  # allowed-skips). Docs-only changesets (spec/rfcs, docs, backlog, decisions
  # data, root *.md) carry no source that eslint or the code formatters cover,
  # and the docs lane is the hot path for filing PRs.
  lint:
    name: Lint & Format
    needs: detect
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  # ── Build & Test matrix (code/mixed only) ───────────────────────────────
  # Skipped when `detect.outputs.docs_only == 'true'`. Per the AISDLC-140
  # design, `re-actors/alls-green` treats `skipped` as success — so
  # docs-only PRs naturally pass the aggregator without paying ~5min × 2
  # node versions of compute.
  build-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    needs: detect
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 dropped (EOL; some deps now require >=22.12, e.g. commander 15,
        # @commitlint/cli 21). Matches ci.yml's [22]. Root engines: node >=22.
        node-version: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # AISDLC-376: full clone so the patch-coverage gate can compute the
          # PR diff (base..head).
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # AISDLC-844: the suite runs ONCE, with coverage on (per-package line
      # floors from each vitest.config.ts apply), instead of `pnpm test` in
      # this job plus `pnpm test:coverage` in a separate Coverage job.
      - run: pnpm test:coverage
      # The non-vitest remainder of `pnpm test` (root gates and checks, and the
      # ucvg-demo node:test suite that has no coverage script).
      - run: pnpm --filter ./ucvg-demo test
      - run: pnpm test:gates && pnpm rfc:check && pnpm dark-code:check && pnpm knowledge:check && pnpm sync:plugin-runtime-deps:check
      # AISDLC-727: ci.yml no longer runs on pull requests, so schema validation
      # (cheap, cross-cutting) runs here instead of only post-merge on main.
      - run: pnpm validate-schemas
      # AISDLC-376: server-side patch-coverage gate (>=90% of added/modified
      # lines covered), reading the coverage-final.json fixtures produced by
      # the `pnpm test:coverage` step above.
      - name: Patch coverage gate (≥90%)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-pr-patch-coverage.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --threshold 90

  integration:
    name: Integration Tests
    needs: detect
    # Skip integration on docs-only PRs (no code surface to integrate
    # against) AND on PRs from forks (which lack repo secrets needed for
    # the reference adapter integration tests). Same predicate as
    # `ci.yml`'s `integration` job — kept in sync deliberately.
    # AISDLC-400: merge_group branch removed (no queue); only skip forks.
    if: |
      needs.detect.outputs.docs_only != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @ai-sdlc/reference test

  # ── Jobs moved from ci.yml (AISDLC-727) ─────────────────────────────────
  # ci.yml no longer runs on pull_request events; these four jobs existed only
  # there. `Backlog Drift` keeps its exact job name because it is a required
  # branch-protection context.
  backlog-drift:
    name: Backlog Drift
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run backlog-drift check (full repo, error-severity gate)
        # Only `error`-severity issues block; info/warning are printed.
        # Pinned to 0.1.3 (URL-fragment fix). Same logic as ci.yml's job.
        run: |
          set -euo pipefail
          # Write the JSON report to a file, never a `$(...)` capture: the
          # tool calls process.exit(1) when it finds issues, and Node does
          # not wait for pending pipe writes, so a capture is cut at the
          # 64 KiB pipe buffer (AISDLC-796). A file redirect is not truncated.
          # The tool exits 1 on any issue regardless of severity, so the exit
          # code is recorded rather than failing fast.
          report="${RUNNER_TEMP:-/tmp}/backlog-drift.json"
          drift_rc=0
          npx backlog-drift@0.1.3 check --json > "$report" 2>/dev/null || drift_rc=$?
          # Pretty-print every issue for the job log so reviewers see
          # context regardless of which severity gates the run.
          npx backlog-drift@0.1.3 check || true
          # Count error-severity entries. `jq -e` returns non-zero when
          # the result is null/false/0, but we want explicit branching
          # so the message is readable in the GitHub UI.
          if ! jq -e 'type == "array"' "$report" >/dev/null 2>&1; then
            echo "::error::Backlog drift report ${report} is not valid JSON (backlog-drift exit code ${drift_rc}); the gate cannot read the report."
            exit 1
          fi
          errors="$(jq '[.[] | select(.severity == "error")] | length' "$report")"
          # Leading indicator (AISDLC-797): the report size and warning count,
          # so growth toward a size problem is visible before it breaks a gate.
          warnings="$(jq '[.[] | select(.severity == "warning")] | length' "$report")"
          echo "[backlog-drift] report size: $(wc -c < "$report" | tr -d ' ') bytes, warnings: ${warnings}"
          echo ""
          echo "[backlog-drift] error-severity issues: ${errors}"
          if [ "${errors}" != "0" ]; then
            echo "::error::Backlog drift gate failed: ${errors} error-severity issue(s) detected. Run \`npx backlog-drift check\` locally and \`npx backlog-drift fix --task <id>\` to auto-fix."
            exit 1
          fi
          echo "[backlog-drift] gate passed (info/warning issues are informational, not blocking)"

  first-run-smoke:
    name: First-run smoke (fresh repo)
    needs: detect
    if: needs.detect.outputs.first_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (orchestrator, pipeline-cli, reference)
        run: |
          pnpm --filter "@ai-sdlc/orchestrator..." \
               --filter "@ai-sdlc/pipeline-cli..." \
               build
      - name: First-run smoke
        run: node scripts/first-run-smoke.mjs

  test-python:
    name: Test Python SDK (${{ matrix.python-version }})
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src/
      - run: mypy src/
      - run: pytest

  test-go:
    name: Test Go SDK
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
      - name: Test sdk-go
        working-directory: sdk-go
        run: go test ./... -v -count=1
      - name: Test sdk-go/operator
        working-directory: sdk-go/operator
        run: go test ./... -v -count=1

  # ── Aggregator ──────────────────────────────────────────────────────────
  # Posts the SINGLE rollup check `ai-sdlc/pr-ready` that adopters configure
  # as their sole required check. Uses `re-actors/alls-green@release/v1`
  # (industry-standard pattern; named adopters in /tmp/research-prior-art.md
  # include aiohttp, attrs, conda, setuptools, pytest, pip-tools, Open edX,
  # PyCA, PyPA, Mergify).
  #
  # Critical correctness details:
  #  1. `if: always()` so the aggregator runs even when an upstream job
  #     failed (otherwise GitHub would skip the aggregator on failure
  #     and the required check would never post → permanent merge block).
  #  2. The action inspects the `needs` context and treats `skipped` as
  #     allowed — which is exactly what archetype-conditional jobs need
  #     (docs-only PRs skip build-test/integration; the gate
  #     should still pass).
  #  3. The job's overall outcome IS the check named `ai-sdlc/pr-ready`
  #     by virtue of the job's `name:` — branch protection matches on
  #     `<workflow-name> / <job-name>` but `re-actors/alls-green` also
  #     posts a check_run named exactly `ai-sdlc/pr-ready` for adopters
  #     who want a stable name independent of job/workflow renames.
  # ── Attestation gate (AISDLC-388, AISDLC-833) ─────────────────────────
  # Runs the DSSE verifier (scripts/verify-attestation.mjs) inline on code PRs
  # under this workflow's single `pull_request` trigger. Scripts come from the
  # BASE sha; the head envelope is fetched as DATA only (AISDLC-704.6). It holds
  # a read-only token, uploads the verdict as an artifact and fails the job on an
  # invalid envelope, which fails `ai-sdlc/pr-ready`. The `ai-sdlc/attestation`
  # status and the DEC-0065 approving review are posted once per head SHA by
  # `attestation-post.yml` (workflow_run, base-defined, no PR code; DEC-0206).
  # Docs-only, draft and dependabot PRs skip the job (alls-green treats
  # `skipped` as success).
  attestation-gate:
    name: Attestation gate (code PRs)
    needs: detect
    # Skipped (→ alls-green treats as success) for:
    #   - docs-only PRs (no code to attest), and
    #   - dependabot[bot] PRs — automation can't run the local reviewer+sign
    #     flow, so dependency bumps are gated by build/test + human review
    #     instead of a DSSE envelope (operator decision 2026-05-30, issue #791).
    if: >-
      needs.detect.outputs.docs_only != 'true' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.verify.outputs.status }}
      reason: ${{ steps.verify.outputs.reason }}
    permissions:
      contents: read
    steps:
      # Trusted scripts come from the BASE sha; the head is fetched as DATA only
      # (never checked out, never executed): AISDLC-704.6.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stage head envelope for verifier (DATA-ONLY git fetch)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO_FULL: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected head sha"; exit 1
          fi
          if ! [[ "$HEAD_REPO_FULL" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::unexpected head repository name"; exit 1
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags "https://github.com/${HEAD_REPO_FULL}.git" \
                "+${HEAD_SHA}:refs/remotes/head/${HEAD_SHA}"; then
              echo "::error::failed to fetch head ${HEAD_SHA} from ${HEAD_REPO_FULL}"; exit 1
            fi
          fi
          bash scripts/stage-attestation-data.sh

      - name: Detect release-please PR
        id: release_please
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.head_ref }}
          # AISDLC-381 iter-2 CRITICAL fix: under pull_request_target a
          # fork PR with branch name release-please--evil would otherwise
          # bypass attestation by matching the prefix-only trust path.
          # The fork-source guard inside the script below requires
          # PR_HEAD_REPO_FULL == REPO before honoring the release-please
          # short-circuit; falls through to full verifier otherwise.
          PR_HEAD_REPO_FULL: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          IS_RP='false'

          # Trust signal: the `release-please--` branch-name prefix +
          # a fork-source guard (same-repo only).
          #
          # We previously gated on BOTH the prefix AND a bot-identity allowlist
          # (github-actions[bot] / release-please[bot] / app/github-actions).
          # That broke the moment release-please-action started pushing under
          # `secrets.AI_SDLC_PAT` (PR #450) — the resulting PR's `user.login`
          # is the operator's identity (e.g. `deefactorial`), NOT a bot. Every
          # legit release-please PR fell through to full verification and
          # posted `contentHashV4 mismatch`.
          #
          # For SAME-REPO PRs, the prefix-only trust is sufficient — the
          # `auto-enable-auto-merge.yml` release-please skip (PR #445) means
          # release-please PRs do NOT auto-merge: the operator MUST manually
          # arm `gh pr merge <N> --auto` to ship one. That human-in-the-loop
          # is the trust gate for prefix bypasses by same-repo pushers.
          #
          # AISDLC-381 (pull_request_target migration) introduced a NEW attack
          # vector: a malicious FORK PR with branch `release-please--evil`
          # would otherwise match this prefix and post
          # `ai-sdlc/attestation: success` on the fork's HEAD SHA — fully
          # bypassing the DSSE attestation gate. The operator-trust argument
          # above DOES NOT cover fork PRs because the malicious code is
          # already in the PR diff at the moment the workflow fires + posts
          # the success status; an operator could miss the prefix bypass
          # entirely until merge. The fix is the fork-source guard below:
          # only honor the prefix when PR_HEAD_REPO_FULL == REPO. Fork PRs
          # with this prefix fall through to the full verifier which will
          # correctly report `no envelope` or `invalid` → status:failure.
          #
          # Net: branch-prefix + fork-source guard matches the actual model.
          # See PR #455 for the original rationale + PR #X (AISDLC-381 iter-2)
          # for the fork-source guard addition.

          # pull_request: branch prefix is sufficient — BUT the prefix
          # is only trustworthy when the PR comes from the SAME repo
          # (not a fork). Under pull_request_target a fork PR with branch
          # name `release-please--evil` would otherwise bypass the
          # attestation verifier entirely and post `ai-sdlc/attestation:
          # success` on a malicious head SHA. The fork-source guard
          # below restricts the short-circuit to same-repo PRs only;
          # any release-please-named branch from a fork falls through
          # to the full envelope verifier path (which will report
          # missing/invalid → status:failure). AISDLC-381 iter-2 CRITICAL.
          case "${PR_HEAD_REF:-}" in
            release-please--*)
              if [ "${PR_HEAD_REPO_FULL:-}" = "${REPO}" ]; then
                IS_RP='true'
                echo "pull_request release-please match: head_ref='${PR_HEAD_REF}' head_repo='${PR_HEAD_REPO_FULL}' (same-repo trust)"
              else
                echo "pull_request release-please prefix on FORK PR ('${PR_HEAD_REPO_FULL}' != '${REPO}') — NOT trusting prefix; falling through to full verification"
              fi
              ;;
          esac

          echo "is_release_please=${IS_RP}" >> "${GITHUB_OUTPUT}"
          echo "Release-please detection: head_ref='${PR_HEAD_REF:-}', is_release_please=${IS_RP}"

      # Skip the full verify pipeline when EITHER short-circuit already posted
      # the success status above. These steps only run for code PRs or mixed PRs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.release_please.outputs.is_release_please != 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release_please.outputs.is_release_please != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install (orchestrator only — verifier needs the runtime barrel)
        if: steps.release_please.outputs.is_release_please != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build orchestrator + dependencies (verifier imports compiled JS)
        # `...` suffix builds @ai-sdlc/orchestrator AND its workspace deps
        # (notably @ai-sdlc/reference) in topological order. Without it the
        # orchestrator build fails with TS2307: cannot find @ai-sdlc/reference.
        if: steps.release_please.outputs.is_release_please != 'true'
        run: pnpm --filter "@ai-sdlc/orchestrator..." build

      # AISDLC-369: ensure signedMergeBase is reachable before running the
      # verifier. Even with fetch-depth: 0, there can be edge cases where a
      # specific commit SHA (signedMergeBase from a v5 envelope) is not yet
      # in the local clone (e.g. a very recent merge that wasn't part of the
      # normal fetch path). This step reads the signedMergeBase from every
      # envelope on disk and explicitly fetches any that are unreachable.
      # Non-fatal: if no envelopes or fetch fails, the verifier handles it.
      - name: Fetch signedMergeBase if unreachable (v5 rebase-stability fix)
        if: steps.release_please.outputs.is_release_please != 'true'
        run: |
          set -euo pipefail
          ATTDIR=".ai-sdlc/attestations"
          if [ ! -d "$ATTDIR" ]; then
            echo "[fetch-signedMergeBase] no attestations dir — skipping"
            exit 0
          fi
          for env_file in "$ATTDIR"/*.dsse.json; do
            [ -f "$env_file" ] || continue
            # Extract signedMergeBase from the decoded payload (jq + base64).
            SMB=$(node -e "
              const {readFileSync} = require('fs');
              const env = JSON.parse(readFileSync('${env_file}', 'utf-8'));
              if (!env.payload) process.exit(0);
              const pred = JSON.parse(Buffer.from(env.payload, 'base64').toString('utf-8'));
              if (pred.signedMergeBase && /^[0-9a-f]{40}$/.test(pred.signedMergeBase)) {
                process.stdout.write(pred.signedMergeBase + '\n');
              }
            " 2>/dev/null || true)
            [ -z "$SMB" ] && continue
            # Check reachability.
            if git cat-file -t "$SMB" >/dev/null 2>&1; then
              echo "[fetch-signedMergeBase] $SMB is reachable — no fetch needed"
            else
              echo "[fetch-signedMergeBase] $SMB unreachable — fetching from origin..."
              git fetch --depth=1 origin "$SMB" 2>/dev/null \
                || git fetch --unshallow origin 2>/dev/null \
                || echo "[fetch-signedMergeBase] WARN: could not fetch $SMB — verifier will fall back to v4"
            fi
          done

      - name: Verify attestation
        id: verify
        if: steps.release_please.outputs.is_release_please != 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-attestation.mjs

      # AISDLC-193 / AISDLC-412 / AISDLC-833 (DEC-0206): this job holds the PR
      # context and runs the verifier but does NOT post the `ai-sdlc/attestation`
      # status or the DEC-0065 approving review; the base-defined
      # `attestation-post.yml` (workflow_run, no PR code) re-runs the verifier
      # from the default branch and posts both, once per head SHA. No artifact
      # from this run is read by the poster.
      #
      # AISDLC-412: `success() || failure()` (never `always()`): a run cancelled
      # by a newer push must not fail the job. A verifier crash (no status
      # output) still fails it.
      - name: Enforce attestation verdict
        if: (success() || failure()) && steps.release_please.outputs.is_release_please != 'true' && steps.verify.outputs.status != 'valid'
        env:
          STATUS: ${{ steps.verify.outputs.status }}
          REASON: ${{ steps.verify.outputs.reason }}
        run: |
          echo "::error::ai-sdlc attestation ${STATUS:-crashed}: ${REASON:-verifier did not emit a result}"
          exit 1

  # ── Dependency review gate (npm + github-actions; issue #791 follow-up) ──
  # Folds dependency-review into the pr-ready rollup so it is a REAL blocking
  # gate. A path-filtered standalone REQUIRED check would deadlock non-dep PRs
  # (the check never posts → branch protection waits forever); folding it here
  # lets alls-green treat this job's `skipped` as success instead. Skips when
  # the PR touches no dependency manifests / workflow / action files; runs and
  # blocks on high+ severity advisories otherwise.
  #
  # This is what makes Dependabot auto-merge SAFE without a human in the loop:
  # a vulnerable bump fails here → pr-ready fails → auto-merge can't fire; a
  # clean bump auto-merges unattended. Covers github-actions SHA bumps too
  # (not just npm manifests) — the gap flagged in PR #792's security review.
  dependency-review-gate:
    name: Dependency review (deps/actions PRs)
    needs: detect
    if: >-
      needs.detect.outputs.deps == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the advisory summary comment on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── DoR readiness gate (AISDLC-712.1, DEC-0056 row 3) ───────────────────
  # The Definition-of-Ready check moved out of the pre-push hook into CI. This
  # job is the single evaluation per PR (AISDLC-834; the former
  # "Evaluate backlog tasks changed by PR" job in dor-ingress.yml is gone): it
  # scores the changed `backlog/tasks/*.md` files, posts the violations
  # comment, and fails on needs-clarification unless the task carries a
  # `blocked.reason` override. Runs ONLY for PRs that add or edit a task file
  # (`detect.outputs.tasks`); other PRs skip it entirely.
  dor-readiness-gate:
    name: DoR readiness (task-file PRs)
    needs: detect
    if: >-
      needs.detect.outputs.tasks == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install + build pipeline-cli
        run: |
          pnpm install --filter @ai-sdlc/pipeline-cli... --frozen-lockfile
          pnpm --filter @ai-sdlc/pipeline-cli build

      - name: List changed backlog/tasks/*.md files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # AISDLC-197: 3-dot diff (`A...B`) finds the merge-base of A and B
          # then diffs from merge-base to B, scoping to only the changes
          # introduced ON THE PR SIDE. With 2-dot (`A B`), when a sibling PR
          # merges to main and moves a backlog file (e.g. `tasks/X.md` →
          # `completed/X.md`), the diff would include that move in the file
          # list even when the PR under evaluation didn't touch the file. The
          # OLD path at `backlog/tasks/X.md` would then ENOENT in the evaluator
          # below. Witnessed on PR #325 at 2026-05-05 02:33:44.
          # Limit to backlog/tasks/*.md additions/modifications (Added or Modified).
          FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA"..."$HEAD_SHA" -- 'backlog/tasks/*.md' || true)
          # GitHub Actions multiline output via heredoc.
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "no-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find task ids pending in other open filing PRs
        id: pending
        if: steps.changed.outputs.no-changes != 'true'
        # AISDLC-879: a task referencing an id whose file exists only in another
        # open filing PR (or landed on main after this run's merge
        # ref was built) is `pending`, not a failure. Map: id -> label.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          : > /tmp/dor-pending.tsv
          # Branch prefixes of no-task (filing/docs) PRs come from .ai-sdlc/pr-lifecycle.yaml.
          node scripts/read-pr-lifecycle.mjs noTaskBranchPrefixes --array > "$RUNNER_TEMP/no-task-prefixes.json"
          PREFIXES_JSON=$(cat "$RUNNER_TEMP/no-task-prefixes.json")
          git fetch --quiet origin main
          git ls-tree --name-only origin/main backlog/tasks/ | while IFS= read -r p; do
            id=$(basename "$p" | sed -E 's/^([A-Za-z]+-[0-9]+(\.[0-9]+)?) .*/\1/' | tr a-z A-Z)
            printf '%s\t%s\n' "$id" "already on main" >> /tmp/dor-pending.tsv
          done
          for n in $(gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,headRefName --jq ".[] | select(.headRefName as \$b | $PREFIXES_JSON | any(. as \$p | \$b | startswith(\$p))) | .number"); do
            [ "$n" = "$PR_NUMBER" ] && continue
            gh api --paginate "repos/$REPO/pulls/$n/files" --jq '.[] | select(.status != "removed") | .filename' \
              | grep -E '^backlog/tasks/[^/]+\.md$' | while IFS= read -r p; do
                id=$(basename "$p" | sed -E 's/^([A-Za-z]+-[0-9]+(\.[0-9]+)?) .*/\1/' | tr a-z A-Z)
                printf '%s\t%s\n' "$id" "open filing PR #$n" >> /tmp/dor-pending.tsv
              done || true
          done
          jq -Rn '[inputs | split("\t") | select(length == 2) | {(.[0]): .[1]}] | add // {}' \
            < /tmp/dor-pending.tsv > /tmp/dor-pending.json
          echo "pending refs: $(cat /tmp/dor-pending.json)"

      - name: Evaluate each changed task
        id: dor_eval
        if: steps.changed.outputs.no-changes != 'true'
        # AISDLC-161: ARTIFACTS_DIR exported so each `dor-evaluate` invocation
        # below appends its calibration entry to the same path the upload
        # step picks up. Same rationale as the issues job — pre-AISDLC-161,
        # the calibration log went to the runner's CWD and was discarded.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FILES: ${{ steps.changed.outputs.files }}
          ARTIFACTS_DIR: /tmp/dor/artifacts
        run: |
          mkdir -p /tmp/dor "$ARTIFACTS_DIR/_dor"
          AI_SDLC_DOR_PENDING_REFS=$(cat /tmp/dor-pending.json)
          export AI_SDLC_DOR_PENDING_REFS
          : > /tmp/dor/results.jsonl
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # AISDLC-197 defense-in-depth: even with 3-dot diff, skip if the
            # file doesn't exist on HEAD (e.g. PR deleted it within its own
            # diff). Prevents ENOENT crash on the dor-evaluate --body-file
            # call below.
            [ ! -f "$f" ] && { echo "::notice::Skipping non-existent file from diff: $f"; continue; }
            ID=$(basename "$f" .md | cut -d- -f1-2)
            set +e
            OUT=$(node pipeline-cli/bin/ai-sdlc-pipeline.mjs \
              dor-evaluate "$ID" --body-file "$f" --source backlog --hermetic)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then
              echo "::error::Failed to evaluate $f (exit $STATUS)"
              echo "$OUT"
              exit "$STATUS"
            fi
            # One JSON line per evaluated task with the source file inlined.
            # SECURITY (AISDLC-115.4 round-2 critical fix): pass $f via env var
            # instead of shell-interpolating into the JS literal. A malicious PR
            # could otherwise add a backlog/tasks/*.md file with a single quote
            # in the name to escape the JS string and execute arbitrary code in
            # the runner. $OUT is also written to a file rather than interpolated
            # to keep the node -e source free of shell-substituted JSON.
            printf '%s\n' "$OUT" > /tmp/dor/_eval_out.json
            EVAL_FILE="$f" node -e "const v = JSON.parse(require('fs').readFileSync('/tmp/dor/_eval_out.json', 'utf8')); v.__file = process.env.EVAL_FILE; process.stdout.write(JSON.stringify(v))" \
              >> /tmp/dor/results.jsonl
            echo >> /tmp/dor/results.jsonl
          done <<< "$FILES"

      - name: Render PR summary comment via pipeline-cli
        if: steps.changed.outputs.no-changes != 'true'
        id: render-pr
        # Single source of truth for comment composition + secret redaction
        # (see `pipeline-cli/src/dor/comment-loop.ts` `renderPrTasksComment`).
        # The inline github-script renderer used to embed `gate.finding`
        # verbatim, so a leaked token in a task body could reflect into the
        # public PR comment.
        run: |
          BODY=$(node pipeline-cli/bin/ai-sdlc-pipeline.mjs \
            dor-render-pr-summary --verdicts-file /tmp/dor/results.jsonl --channel author)
          {
            echo 'body<<__DOR_END__'
            printf '%s' "$BODY"
            echo
            echo '__DOR_END__'
          } >> "$GITHUB_OUTPUT"

      - name: Post idempotent PR summary comment
        if: steps.changed.outputs.no-changes != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOR_BODY: ${{ steps.render-pr.outputs.body }}
        with:
          script: |
            const marker = '<!-- ai-sdlc:dor-comment channel="author" -->';
            const body = process.env.DOR_BODY;
            if (!body || !body.includes(marker)) {
              core.setFailed('dor-render-pr-summary produced an empty or marker-less body');
              return;
            }

            const pr_number = context.payload.pull_request.number;
            // `github.paginate` instead of a single per_page=100 call —
            // PRs with >100 prior comments still need to find the marker
            // or we'd post a duplicate summary on every CI run.
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              per_page: 100,
            });
            const prior = existing.find((c) => c.body && c.body.includes(marker));
            if (prior) {
              if (prior.body.trim() === body.trim()) {
                core.info('DoR PR comment unchanged — no-op.');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
              core.notice(`Updated DoR PR comment ${prior.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body,
              });
              core.notice(`Created DoR PR comment ${created.id}`);
            }

      - name: Upload DoR calibration entries as workflow artifact
        # AISDLC-161 — same rationale as the issues job: persist the JSONL
        # so `gh run download` + `cli-dor-corpus aggregate` can build the
        # FP-rate digest. PR job evaluates N tasks per run, so the JSONL
        # may contain N entries (one per changed `backlog/tasks/*.md`).
        # `if: always()` so partial failures still leave a trail.
        if: always() && hashFiles('/tmp/dor/artifacts/_dor/calibration.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dor-calibration-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: /tmp/dor/artifacts/_dor/calibration.jsonl
          retention-days: 90
          if-no-files-found: ignore

      # AISDLC-379 — compute the workflow-gate signal `has_violations` from
      # the SAME JSONL the renderer above consumed, applying the
      # `blocked.reason` operator-override rule from
      # `pipeline-cli/src/dor/upstream-oq-gate.ts` so the gate stays in
      # lockstep with the `refineBacklogTask()` ingress shim used by
      # `/ai-sdlc execute`. Pre-AISDLC-379, the workflow posted a
      # comment listing violations and then exited 0 — the `Evaluate
      # backlog tasks changed by PR` check flipped to SUCCESS regardless,
      # and auto-merge armed against PRs with unresolved Gate-3 violations
      # (the 2026-05-20 RFC-0041 task-breakdown incident).
      - name: Compute has_violations
        id: compute_violations
        if: steps.changed.outputs.no-changes != 'true'
        run: |
          # Write the gate envelope to disk and parse it from there so the
          # subsequent `node -e` calls don't have to deal with shell-escaping
          # an arbitrary JSON blob (the renderer output above uses the same
          # write-then-read pattern for the same reason — see the SECURITY
          # comment under "Evaluate each changed task").
          node pipeline-cli/bin/ai-sdlc-pipeline.mjs \
            dor-pr-has-violations --verdicts-file /tmp/dor/results.jsonl \
            > /tmp/dor/violations.json
          cat /tmp/dor/violations.json
          HAS=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/tmp/dor/violations.json','utf8')).has_violations))")
          COUNT=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/tmp/dor/violations.json','utf8')).blocking.length))")
          echo "has_violations=$HAS" >> "$GITHUB_OUTPUT"
          echo "blocking_count=$COUNT" >> "$GITHUB_OUTPUT"

      # AISDLC-379 — actually fail the check when has_violations=true. The
      # comment posted above tells the operator WHAT to fix; this step
      # blocks the merge so they DO fix it (or set blocked.reason in
      # frontmatter as the explicit override). Skipped when no backlog
      # files changed (no-op PR), or when has_violations stayed false
      # (clean PR or all violations overridden).
      - name: Fail check on unresolved violations
        if: steps.changed.outputs.no-changes != 'true' && steps.compute_violations.outputs.has_violations == 'true'
        run: |
          echo "::error::DoR violations detected in ${{ steps.compute_violations.outputs.blocking_count }} staged backlog task change(s). See PR comment for details."
          echo "::error::Fix the offending task body or set blocked.reason in frontmatter; push to re-evaluate."
          exit 1

  # ── Independence policy gate (RFC-0046 Phase 4, AISDLC-591) ─────────────
  # Enforces the repo's per-repo `.ai-sdlc/independence-policy.yaml`
  # `requiredTier` (default `none` — no behavior change) against the
  # envelope's `overallIndependenceTier` (AISDLC-588). This is the
  # BRANCH-PROTECTION half of the gate-topology-agnostic enforcement
  # contract; the SAME comparison (`pipeline-cli/src/attestation/
  # independence-policy.ts:evaluateIndependencePolicy`) is invoked by a
  # ship-skill for procedural-gate adopters with no branch protection.
  #
  # Cost-conscious by construction: the FIRST step reads only the flat
  # `requiredTier:` scalar via a grep — cheap, no pnpm install. The default
  # `none` policy (the overwhelming majority of repos, including this one
  # today) short-circuits immediately with zero build cost. Only an
  # adopter who has opted INTO `attested`/`isolated` enforcement pays for
  # the orchestrator build + verifier run below.
  independence-policy-gate:
    name: Independence policy gate
    needs: detect
    if: >-
      needs.detect.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # AISDLC-591 review MAJOR (code + security): the cheap pre-check must NOT
      # re-parse the policy YAML's tier — a bash grep/sed reader diverges from the
      # canonical `parseIndependencePolicyYaml` (trim + last-match-wins), which can
      # under-enforce (fail open) on a crafted/malformed-but-parseable trusted
      # policy file. The ONLY cheap decision made here is UNAMBIGUOUS file presence;
      # when the file exists, the single canonical CLI parser
      # (`cli-attestation independence-policy`) decides none-vs-attested-vs-isolated
      # and its exit code. One parser, one source of truth.
      - name: Detect independence policy presence (cheap, no install)
        id: policy
        run: |
          set -euo pipefail
          if [ -f ".ai-sdlc/independence-policy.yaml" ]; then
            echo "[independence-policy-gate] policy file present — deferring to canonical CLI evaluator"
            echo "has-policy=true" >> "$GITHUB_OUTPUT"
          else
            echo "[independence-policy-gate] no .ai-sdlc/independence-policy.yaml — default requiredTier=none, informational only"
            echo "has-policy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.policy.outputs.has-policy == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.policy.outputs.has-policy == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build (only when a policy file is present)
        if: steps.policy.outputs.has-policy == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@ai-sdlc/orchestrator..." build
      - name: Enforce independence policy (canonical evaluator decides requiredTier)
        if: steps.policy.outputs.has-policy == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node pipeline-cli/bin/cli-attestation.mjs independence-policy \
            --head "$HEAD_SHA" \
            --base "$BASE_SHA"

  # ── Governance gate (AISDLC-764) ────────────────────────────────────────
  # Rules that used to live only in prose or reviewer judgement, as code:
  #   - CHANGELOG.md edits off the same-repo release-please branch fail
  #     (AISDLC-401); the branch name alone is not trusted, a fork can spoof it
  #   - scope-creep HEURISTIC: a review/audit task PR that adds a
  #     backlog/tasks file fails (AISDLC-308); a backstop, not complete
  #     enforcement, reviewers still check
  #   - a new RFC Open Questions resolution marker fails unless an APPROVED
  #     review on the head SHA from a lifecycle-approvers.yaml login (read from
  #     the BASE ref) other than the PR author exists (AISDLC-298); reviews are
  #     fetched here with GITHUB_TOKEN, never taken from PR-controlled text
  #   - a code PR whose attestation lacks the full reviewer set fails
  #     (code + test + security, or correctness + security). That check reads
  #     reviewer NAMES only and is NOT an independent control: signature and
  #     transcript verification are verify-attestation / attestation-gate.
  #     Docs-only, dependabot and same-repo release-please PRs are exempt,
  #     matching attestation-gate.
  # Deterministic, no install, no LLM. The checker scripts run from the BASE
  # commit against the head tree so a PR cannot weaken its own checks; while
  # the base predates them (bootstrap) the head copy is used with a visible
  # warning, never silently skipped. Each check fails closed on its own inputs.
  governance-gate:
    name: Governance gate
    needs: detect
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Select trusted checker scripts (base commit)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted"
          mkdir -p "$TRUSTED"
          if git cat-file -e "$BASE_SHA:scripts/check-pr-governance.mjs" \
            && git show "$BASE_SHA:scripts/check-rfc-docs.mjs" | grep -q -- '--oq-scan'; then
            git archive "$BASE_SHA" scripts pipeline-cli/attestation-core | tar -x -C "$TRUSTED"
            echo "::notice::governance checkers taken from base commit $BASE_SHA"
          else
            echo "::warning::base commit lacks the governance checkers (bootstrap); using the PR's own copies. Not an independent control until the base carries them."
            mkdir -p "$TRUSTED/pipeline-cli"
            cp -R scripts "$TRUSTED/scripts"
            cp -R pipeline-cli/attestation-core "$TRUSTED/pipeline-cli/attestation-core"
          fi
          echo "TRUSTED=$TRUSTED" >> "$GITHUB_ENV"
      - name: PR governance checks (changelog, scope-creep, reviewers)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          SKIP_REVIEWERS=false
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then SKIP_REVIEWERS=true; fi
          node "$TRUSTED/scripts/check-pr-governance.mjs" all \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --branch "$HEAD_REF" --head-repo "$HEAD_REPO" --base-repo "$BASE_REPO" \
            --title "$PR_TITLE" \
            --docs-only "$DOCS_ONLY" --skip-reviewers "$SKIP_REVIEWERS"
      - name: RFC Open Questions resolution markers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Approving logins come from the GitHub API, not PR-controlled text.
          # A fetch or parse failure fails the step (pipefail), never "no approvals".
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s --arg sha "$HEAD_SHA" \
              '[.[][] | select(.state == "APPROVED" and .commit_id == $sha) | .user.login] | unique' \
            > "$RUNNER_TEMP/approving-logins.json"
          MB=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          node "$TRUSTED/scripts/check-rfc-docs.mjs" --oq-scan \
            --base-ref "$MB" --head-ref "$HEAD_SHA" \
            --approving-logins-file "$RUNNER_TEMP/approving-logins.json" \
            --pr-author "$PR_AUTHOR"

  pr-ready:
    name: ai-sdlc/pr-ready
    needs:
      [
        detect,
        lint,
        build-test,
        integration,
        backlog-drift,
        first-run-smoke,
        test-python,
        test-go,
        attestation-gate,
        independence-policy-gate,
        dependency-review-gate,
        dor-readiness-gate,
        governance-gate,
      ]
    # AISDLC-218: skip the rollup on draft PRs. With all upstream jobs skipped
    # (per their own draft guards), `re-actors/alls-green` treats all-skipped
    # as failure → posts `ai-sdlc/pr-ready: failure` on every draft sync.
    # Skipping the rollup means no required check posts on draft, which is
    # fine — drafts can't merge anyway, and on `ready_for_review` the
    # workflow fires fresh and pr-ready posts correctly.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Aggregate required signals
        uses: re-actors/alls-green@release/v1
        with:
          # `jobs` is the JSON of the `needs` context — the action walks
          # each job's `result` and decides pass/fail.
          #
          # Actual alls-green behavior (NOT the same as GitHub's naive needs:):
          #   jobs in allowed-skips  → success OR skipped → pass
          #   jobs NOT in allowed-skips → MUST be success (skipped = FAIL)
          #   failure | cancelled (any job) → fail
          #
          # archetype-conditional jobs that legitimately skip must be listed
          # in allowed-skips so that the aggregator doesn't fail on their skip:
          #   - lint / build-test / integration: skip on docs-only PRs
          #   - attestation-gate: skips on docs-only PRs (paths-ignore)
          #   - independence-policy-gate: skips on docs-only PRs (AISDLC-591)
          #   - dependency-review-gate: skips on non-dep PRs (deps==false)
          #   - dor-readiness-gate: skips on PRs that touch no backlog/tasks/*.md
          #     file (AISDLC-712.1); on task-file PRs it must be success
          #
          # The skipped-job deadlock bug (discovered 2026-05-31): alls-green
          # treats skipped as FAILURE for jobs not in allowed-skips. Adding
          # dependency-review-gate to allowed-skips fixes the regression
          # introduced by PR #794 that blocked all non-dep PRs.
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            lint,
            build-test,
            integration,
            first-run-smoke,
            test-python,
            test-go,
            attestation-gate,
            independence-policy-gate,
            dependency-review-gate,
            dor-readiness-gate
