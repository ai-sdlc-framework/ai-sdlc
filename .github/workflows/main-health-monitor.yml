name: Main Health Monitor

# AISDLC-406: Reactive complement to the no-queue direct-merge model introduced
# by AISDLC-400. Without a merge queue, concurrent merges can combine to break
# main even when each individual PR was green at merge time. This workflow runs
# the FULL test suite on every push to main and goes red and fails the run when main
# is red. AISDLC-929: the dispatch tick reads the run conclusion and routes a red
# sha to the planner once; no GitHub issue or label is created.
#
# Motivating incident: AISDLC-398 + AISDLC-400 + AISDLC-405 all had green CI
# individually but combined to break main's test suite (AISDLC-405 was the
# cleanup PR that blocked 5 other PRs from merging while main was red).
#
# This is NOT a PR gate — it fires only on push to main (post-merge). It is
# explicitly decoupled from `ai-sdlc/pr-ready` (per-PR gate). AISDLC-842: this
# is the single main-push suite; ci.yml and scorecard.yml no longer run on push.
#
# See docs/operations/main-health-monitor.md for the full operator runbook.

on:
  push:
    branches: [main]
  # AISDLC-768: daily run with no push, so a test that rots with the calendar
  # (clock-dependent fixtures) is caught the day it breaks, not at the next
  # unrelated push. Scheduled runs check out the default-branch head.
  schedule:
    - cron: '0 6 * * *'
  # No pull_request trigger — this is a post-merge health check, not a PR gate.

# AC-3: cancel-in-progress: false — every main push gets its own health check.
# Rationale: if push N is failing and push N+1 lands (a fix attempt), we want
# BOTH health checks to complete so we can confirm the fix resolved the failure.
# Cancelling N when N+1 arrives would leave the failure unconfirmed and the
# failure unrecorded.
concurrency:
  group: main-health-monitor
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health-check:
    name: Full Suite Health Check
    runs-on: ubuntu-latest
    # Output the test result for downstream readers.
    outputs:
      test_status: ${{ steps.test-outcome.outputs.status }}
      commit_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (full workspace)
        run: pnpm build

      # AC-1: Run the full pnpm test suite. This is intentionally the full suite
      # (not affected-package filtered) because the whole point of this workflow
      # is to catch cross-package skew that per-PR affected-package CI misses.
      - name: Test (full suite)
        id: full-test
        # Don't fail-fast — capture the outcome and let the outcome step decide.
        continue-on-error: true
        run: pnpm -r test

      # AISDLC-842: ci.yml no longer runs on push to main, so this workflow is the
      # single main-push suite. These steps carry the remaining checks ci.yml ran
      # on push: lint, format, schema validation, full coverage, first-run smoke.
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Validate schemas
        id: schemas
        continue-on-error: true
        run: pnpm validate-schemas

      # AISDLC-902: `pnpm test` runs rfc:check but this job runs `pnpm -r test`,
      # so an invalid RFC status sat on main unseen.
      - name: RFC docs check
        id: rfc-check
        continue-on-error: true
        run: pnpm rfc:check

      - name: Coverage (full)
        id: coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: First-run smoke
        id: smoke
        continue-on-error: true
        run: node scripts/first-run-smoke.mjs

      # AC-1: Also run the workflow-test suite under .github/workflows/__tests__/.
      # These tests validate workflow YAML structure and are separate from per-package
      # unit tests — they're included here so a broken workflow file (e.g. a merge
      # conflict that corrupts YAML) surfaces as a named failure rather than a silent
      # CI breakage.
      - name: Test (workflow YAML tests)
        id: workflow-test
        continue-on-error: true
        run: |
          # AISDLC-406 review fix: a SINGLE `node --test` invocation over the
          # whole __tests__ glob. The runner executes EVERY matched file and
          # reports EVERY failure, then exits non-zero if any failed. The prior
          # form chained one `node --test` per file under `bash -eo pipefail`,
          # which aborted on the first failing file and silenced the rest — so a
          # red main caused by a later file was misreported as the first file's
          # failure. The glob also auto-includes any future workflow test files.
          node --test .github/workflows/__tests__/*.test.mjs

      # AISDLC-549: `pnpm -r test` runs only workspace-member `test` scripts; the
      # plugin's `node --test` doc-contract suites (agents/commands/hooks/scripts)
      # are not a workspace member's `test`, so five failures sat on main unseen.
      - name: Test (plugin node --test suite)
        id: plugin-test
        continue-on-error: true
        run: pnpm test:plugin-suite-gate

      # Consolidate the two step outcomes into a single job output.
      - name: Determine test outcome
        id: test-outcome
        run: |
          full="${{ steps.full-test.outcome }}"
          workflow="${{ steps.workflow-test.outcome }}"
          extra="plugin=${{ steps.plugin-test.outcome }} lint=${{ steps.lint.outcome }} format=${{ steps.format.outcome }} schemas=${{ steps.schemas.outcome }} rfc=${{ steps.rfc-check.outcome }} plugin-pins=${{ steps.plugin-pins.outcome }} coverage=${{ steps.coverage.outcome }} smoke=${{ steps.smoke.outcome }}"
          echo "full-test outcome: $full"
          echo "workflow-test outcome: $workflow"
          echo "other outcomes: $extra"
          if [[ "$full" == "success" && "$workflow" == "success" && "$extra" != *failure* && "$extra" != *cancelled* ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "[main-health] all suites PASS"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "[main-health] FAIL — full-test=$full workflow-test=$workflow $extra"
          fi

      # Exit non-zero when any suite failed so this job itself is marked red;
      # the dispatch tick reads the run conclusion (AISDLC-929).
      - name: Fail on test failure
        if: steps.test-outcome.outputs.status == 'failure'
        run: |
          {
            echo "## main is RED at ${GITHUB_SHA:0:8}"
            echo ""
            echo "full-test=${{ steps.full-test.outcome }} workflow-test=${{ steps.workflow-test.outcome }} plugin-test=${{ steps.plugin-test.outcome }} plugin-pins=${{ steps.plugin-pins.outcome }}"
            echo "Runbook: docs/operations/main-health-monitor.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::main health check FAILED — full-test=${{ steps.full-test.outcome }} workflow-test=${{ steps.workflow-test.outcome }} plugin-test=${{ steps.plugin-test.outcome }} plugin-pins=${{ steps.plugin-pins.outcome }}"
          echo "::error::See the steps above for failing test output."
          echo "::error::Runbook: docs/operations/main-health-monitor.md"
          exit 1

  # AISDLC-797: run the gate scripts PRs run against main itself, so a gate that
  # is broken for every branch pages within minutes of the change that broke it
  # instead of being discovered one red PR at a time (the 2026-10-10 Backlog
  # Drift outage). Each step records its outcome; the last step fails the job.
  gate-scripts:
    name: Gate Scripts On Main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pipeline-cli (patch-id parity and DoR need dist)
        run: pnpm --filter @ai-sdlc/pipeline-cli... build

      - name: Gate - backlog drift
        id: gate-drift
        continue-on-error: true
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:-/tmp}/backlog-drift.json"
          drift_rc=0
          npx backlog-drift@0.1.3 check --json > "$report" 2>/dev/null || drift_rc=$?
          if ! jq -e 'type == "array" or type == "object"' "$report" >/dev/null 2>&1; then
            echo "::error::Backlog drift report ${report} is not valid JSON (backlog-drift exit code ${drift_rc})."
            exit 1
          fi
          errors="$(jq '[.[] | select(.severity == "error")] | length' "$report")"
          echo "[gate-scripts] drift report $(wc -c < "$report" | tr -d ' ') bytes, error-severity issues: ${errors}"
          [ "${errors}" = "0" ]

      - name: Gate - docs-only classifier
        id: gate-docs-only
        continue-on-error: true
        run: |
          set -euo pipefail
          RESULT=$(git -c core.quotePath=false ls-files | node scripts/is-docs-only-changeset.mjs)
          echo "[gate-scripts] docs-only classifier over tracked files: ${RESULT}"
          [ "$RESULT" = "true" ] || [ "$RESULT" = "false" ]

      - name: Gate - DoR violations
        id: gate-dor
        continue-on-error: true
        run: |
          set -euo pipefail
          verdicts="${RUNNER_TEMP:-/tmp}/dor-results.jsonl"
          out="${RUNNER_TEMP:-/tmp}/dor-violations.json"
          : > "$verdicts"
          dor_rc=0
          node pipeline-cli/bin/ai-sdlc-pipeline.mjs dor-pr-has-violations --verdicts-file "$verdicts" > "$out" || dor_rc=$?
          if ! jq -e 'type == "object"' "$out" >/dev/null 2>&1; then
            echo "::error::DoR violations report ${out} is not valid JSON (exit code ${dor_rc})."
            exit 1
          fi

      - name: Gate - dark-code
        id: gate-dark-code
        continue-on-error: true
        run: node scripts/check-dark-code.mjs

      - name: Gate - patch-id exclusions parity
        id: gate-patch-id
        continue-on-error: true
        run: node --test scripts/check-attestation-sign.test.mjs

      - name: Determine gate outcome
        run: |
          fail=0
          for pair in \
            "backlog-drift=${{ steps.gate-drift.outcome }}" \
            "docs-only-classifier=${{ steps.gate-docs-only.outcome }}" \
            "dor-violations=${{ steps.gate-dor.outcome }}" \
            "dark-code=${{ steps.gate-dark-code.outcome }}" \
            "patch-id-parity=${{ steps.gate-patch-id.outcome }}"; do
            echo "[gate-scripts] ${pair}"
            case "$pair" in *=success) ;; *) fail=1 ;; esac
          done
          if [ "$fail" = "1" ]; then
            echo "::error::a gate script failed on main; see the steps above. Runbook: docs/operations/main-health-monitor.md"
            exit 1
          fi

  # AISDLC-1023: prove the pipeline can still ship a PR, on the filesystem the
  # executors run on (macOS is case-insensitive; Linux hid the 2026-10-21 Step
  # 10.5 outage). Not continue-on-error: a red canary is a red run. The notify
  # step posts pipeline-canary-red / -green with the sha to the RFC-0054 webhook
  # (secrets AI_SDLC_WEBHOOK_URL and AI_SDLC_WEBHOOK_SECRET); the dispatch tick
  # holds the board and files a hotfix. See docs/operations/main-health-monitor.md.
  pipeline-canary:
    name: Pipeline Canary (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pipeline-cli
        run: pnpm --filter @ai-sdlc/pipeline-cli... build

      - name: Run pipeline canary
        id: canary
        continue-on-error: true
        run: node scripts/pipeline-canary.mjs 2>&1 | tee "$RUNNER_TEMP/canary.log"; exit "${PIPESTATUS[0]}"

      - name: Notify dispatch webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.AI_SDLC_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.AI_SDLC_WEBHOOK_SECRET }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "[pipeline-canary] no webhook configured; skipping notify"
            exit 0
          fi
          if [ "$CANARY_OUTCOME" = "success" ]; then kind=pipeline-canary-green; else kind=pipeline-canary-red; fi
          detail="$(tail -c 3500 "$RUNNER_TEMP/canary.log" 2>/dev/null || true)"
          body="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg detail "$detail" '{repository: {full_name: $repo}, sha: $sha, detail: $detail}')"
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -sS --max-time 20 -X POST "$WEBHOOK_URL" \
            -H "content-type: application/json" \
            -H "x-github-event: $kind" \
            -H "x-github-delivery: canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "x-hub-signature-256: $sig" \
            --data "$body" || echo "::warning::could not reach the dispatch webhook"

      - name: Fail on canary failure
        if: steps.canary.outcome != 'success'
        run: |
          echo "## pipeline canary is RED at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::pipeline canary FAILED; see 'Run pipeline canary'. Runbook: docs/operations/main-health-monitor.md"
          exit 1

  # AISDLC-842: SDK suites ci.yml ran on push (unfiltered here: a push has no
  # reliable path diff for a post-merge health check).
  test-python:
    name: Test Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src/
      - run: mypy src/
      - run: pytest

  test-go:
    name: Test Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - name: Test sdk-go
        working-directory: sdk-go
        run: go test ./... -v -count=1
      - name: Test sdk-go/operator
        working-directory: sdk-go/operator
        run: go test ./... -v -count=1
