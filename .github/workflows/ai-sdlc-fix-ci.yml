name: AI-SDLC Fix CI

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fix-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  fix-ci:
    name: Fix CI Failures
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    # SECURITY (issue #780, CodeQL actions/untrusted-checkout): this job runs in
    # the privileged workflow_run context with secrets (AI_SDLC_PAT write token +
    # ANTHROPIC_API_KEY) and checks out + builds the PR-head code. It MUST only
    # ever act on SAME-REPO branches. The head_repository == repository guard
    # rejects fork-originated runs (the head_branch prefix check alone is NOT a
    # security boundary — a forker can name their branch `ai-sdlc/issue-*`).
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'ai-sdlc/issue-')
    steps:
      - name: Extract PR number
        id: pr
        env:
          WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          PR=$(echo "$WORKFLOW_RUN" | jq '.pull_requests[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No PR found for this workflow run. Skipping."
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # SECURITY (AISDLC-704, code-scanning alert 173): the privileged checkout
      # is the TRUSTED default branch (no `ref:`), which supplies the tooling
      # (pnpm install/build of the fix-ci pipeline) with the write PAT in scope.
      # The PR branch is fetched as DATA into a separate `pr-work/` worktree by
      # the next step and is never installed/built in the secret-holding root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number
        with:
          # No PAT here and credentials are NOT persisted: the pr-work worktree
          # shares this repo's .git/config, so anything persisted would be
          # readable by PR-branch code (install scripts, tests). The PAT is
          # injected only into the pipeline step's process env below.
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch PR branch into separate pr-work/ worktree (DATA, not tooling)
        if: steps.pr.outputs.number
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Job token scoped to this single command via -c; nothing is written
          # to .git/config.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch --no-tags origin "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          git worktree add -B "$HEAD_BRANCH" pr-work "refs/remotes/origin/${HEAD_BRANCH}"
          git -C pr-work branch --set-upstream-to="origin/${HEAD_BRANCH}" "$HEAD_BRANCH"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pr.outputs.number

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pr.outputs.number
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.pr.outputs.number

      - run: pnpm build
        if: steps.pr.outputs.number

      # PR worktree deps (no secrets in env, no persisted git credentials) so
      # the agent's validation can run against the PR branch inside pr-work/.
      # --ignore-scripts: PR-controlled lifecycle scripts (preinstall/prepare)
      # never run; the pipeline only needs the installed modules for tests.
      - name: Install PR worktree dependencies
        if: steps.pr.outputs.number
        working-directory: pr-work
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Claude Code CLI
        if: steps.pr.outputs.number
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        if: steps.pr.outputs.number
        run: |
          git config user.name "ai-sdlc[bot]"
          git config user.email "ai-sdlc-bot@users.noreply.github.com"
          git -C pr-work config user.name "ai-sdlc[bot]"
          git -C pr-work config user.email "ai-sdlc-bot@users.noreply.github.com"

      - name: Run fix-CI pipeline
        if: steps.pr.outputs.number
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AI_SDLC_PAT }}
          # gh CLI uses GH_TOKEN; default token has actions:read for log fetching
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pass run-context values via env (not inline ${{ }} in run:) to avoid
          # script-injection (CodeQL actions/code-injection, issue #780).
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          # The pipeline operates on the PR branch worktree; tooling runs from
          # the trusted checkout (AISDLC-704).
          AI_SDLC_FIX_CI_WORKDIR: ${{ github.workspace }}/pr-work
        run: |
          # The pipeline's final `git push origin <branch>` (orchestrator
          # fix-ci.ts) needs write auth. Supply the PAT as process-scoped git
          # config via env (GIT_CONFIG_*), never persisted to .git/config.
          # Residual: the pipeline process (and the agent it spawns in pr-work)
          # holds the PAT in its environment for the duration of this step.
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          pnpm --filter @ai-sdlc/dogfood fix-ci --pr "$PR_NUMBER" --run-id "$WORKFLOW_RUN_ID"

      - name: Collect pipeline artifacts
        if: always() && steps.pr.outputs.number
        run: |
          mkdir -p .ai-sdlc
          cp /tmp/ai-sdlc-diagnostics-audit.jsonl .ai-sdlc/diagnostics-audit.jsonl 2>/dev/null || true
          cp pr-work/.ai-sdlc/diagnostics-audit.jsonl .ai-sdlc/pr-work-diagnostics-audit.jsonl 2>/dev/null || true

      - name: Upload pipeline artifacts
        if: always() && steps.pr.outputs.number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-fix-ci-pr-${{ steps.pr.outputs.number }}
          path: .ai-sdlc/
          if-no-files-found: ignore
          retention-days: 30
