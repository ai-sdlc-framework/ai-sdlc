name: Isolated Review (RFC-0047 Phase 4)

# RFC-0047 Phase 4 — AISDLC-596
#
# Opt-in, same-repo-only "isolated" independence-tier producer. Composes the
# RFC-0043 substrate (SandboxDriver + inference.local reviewer fan-out) with a
# clean-room signer that mints the v6 envelope in a SEPARATE, PROTECTED CI job
# using a ci-only signing key — NEVER the operator's key, NEVER present in the
# sandbox job. The signed envelope is COMMITTED back to the PR branch so the
# offline, patch-id-keyed verifier can find it (RFC-0047 OQ-4 — the AISDLC-590
# "claim discarded" gap this closes).
#
# ── Scope: internal same-repo PRs only ───────────────────────────────────────
# This is NOT the untrusted-contributor gate (that's untrusted-pr-gate.yml /
# RFC-0043 Phase 5, which the sandbox/signer substrate is shared with). This
# workflow serves internal reviewers who want a stronger, re-derivable
# independence claim than `attested` for a specific PR. Fork PRs are refused
# outright (guard below) — a fork PR cannot push the signed envelope back to
# the PR branch, and importantly a fork PR's own modified pipeline-cli source
# must never be trusted to self-report its own independence tier.
#
# ── Opt-in gating (cost control) ──────────────────────────────────────────────
# Two independent gates, BOTH required:
#   1. Repository variable `AI_SDLC_ISOLATED_REVIEW` truthy (1/true/yes/on).
#      Default OFF — routine PRs stay on `attested`/`none` at zero extra cost.
#   2. The PR carries the `isolated-review` label (opt-in per-PR).
#
# ── Trust boundary (RFC-0047 §Design Details (4)) ────────────────────────────
# Job 1 (sandbox-review) runs the 3-reviewer matrix inside the RFC-0043
# sandbox and emits the UNSIGNED report — no signing key anywhere near it.
# Job 2 (clean-room-sign-isolated) runs in a SEPARATE job, gated by a
# protected GitHub Actions `environment:` (required reviewers configurable in
# Settings > Environments), and is the ONLY place `AISDLC_CI_SIGNING_KEY_CONTENT`
# is materialized. See docs/operations/ci-only-trust-marker.md for registering
# the corresponding public key in .ai-sdlc/trusted-reviewers.yaml as `ciOnly: true`.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: read

env:
  ISOLATED_REVIEW_FLAG: ${{ vars.AI_SDLC_ISOLATED_REVIEW || 'off' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Sandbox + hardened reviewer matrix (RFC-0043 substrate, reused as-is).
  # Emits the UNSIGNED report. No signing key present in this job.
  # ────────────────────────────────────────────────────────────────────────────
  sandbox-review:
    name: 'Isolated review: sandbox + reviewer matrix (RFC-0043 substrate)'
    # Same-repo-only guard: a fork PR cannot be trusted to produce its own
    # independence claim, and cannot push the signed envelope back anyway.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'isolated-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flag_on: ${{ steps.flag-check.outputs.enabled }}
      report_artifact: ${{ steps.sandbox.outputs.report_artifact }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pipeline-cli
        run: pnpm --filter @ai-sdlc/pipeline-cli build

      - name: Check AI_SDLC_ISOLATED_REVIEW feature flag
        id: flag-check
        run: |
          FLAG="${{ env.ISOLATED_REVIEW_FLAG }}"
          FLAG_LOWER=$(echo "$FLAG" | tr '[:upper:]' '[:lower:]')
          if [[ "$FLAG_LOWER" == "1" || "$FLAG_LOWER" == "true" || "$FLAG_LOWER" == "yes" || "$FLAG_LOWER" == "on" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "[isolated-review] feature flag ON + isolated-review label present — engaging"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "[isolated-review] feature flag OFF (AI_SDLC_ISOLATED_REVIEW repo variable) — skipping"
          fi

      - name: 'Stage 2/3 — Run RFC-0043 sandbox + reviewer matrix (isolated review)'
        id: sandbox
        if: steps.flag-check.outputs.enabled == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Real in-sandbox model invocation requires ANTHROPIC_API_KEY +
          # AI_SDLC_SANDBOX_INTEGRATION_TESTS=1 (see resolveModelClient() in
          # pipeline-cli/src/cli/ucvg.ts). Without a credential configured the
          # sandbox still runs (fail-closed FakeModelClient); operators wire a
          # real model credential when ready for production isolated reviews.
          AI_SDLC_SANDBOX_INTEGRATION_TESTS: ${{ vars.AI_SDLC_ISOLATED_REVIEW_INTEGRATION || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.AI_SDLC_ISOLATED_REVIEW_ANTHROPIC_API_KEY }}
        run: |
          node pipeline-cli/bin/cli-ucvg.mjs sandbox-run \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PR_HEAD_SHA" \
            --base-sha "$PR_BASE_SHA" \
            --pr-content-dir . \
            --work-dir . \
            --output-dir .ai-sdlc/ucvg/reports \
            2>&1 | tee /tmp/sandbox-run.log

          REPORT_PATH=".ai-sdlc/ucvg/reports/${PR_NUMBER}.unsigned.json"
          if [[ -f "$REPORT_PATH" ]]; then
            echo "report_artifact=$REPORT_PATH" >> "$GITHUB_OUTPUT"
            echo "[isolated-review] unsigned report artifact: $REPORT_PATH"
          else
            echo "report_artifact=" >> "$GITHUB_OUTPUT"
            echo "[isolated-review] WARNING: sandbox exited without producing a report artifact"
            exit 1
          fi

      # Cross-runner artifact transfer — the signing job runs on a SEPARATE
      # runner (RFC-0047 §Design Details (4): a SEPARATE, protected CI job)
      # and cannot read this job's local filesystem.
      - name: Upload unsigned report artifact (for clean-room-sign-isolated cross-runner transfer)
        if: steps.sandbox.outputs.report_artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-review-unsigned-report-${{ github.event.pull_request.number }}
          path: ${{ steps.sandbox.outputs.report_artifact }}
          retention-days: 1
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Clean-room sign with the ci-only key, in a protected environment.
  # The ci-only private key MUST NEVER be present in Job 1. Configure required
  # reviewers on the `isolated-review-signing` GitHub Actions environment
  # (Settings > Environments) so a malicious workflow edit cannot silently use
  # the secret without an approval gate (RFC-0047 OQ-1 rebuttal).
  # ────────────────────────────────────────────────────────────────────────────
  clean-room-sign-isolated:
    name: 'Isolated review: clean-room sign (ci-only key, protected environment)'
    needs: sandbox-review
    if: >
      needs.sandbox-review.outputs.flag_on == 'true' &&
      needs.sandbox-review.outputs.report_artifact != ''
    runs-on: ubuntu-latest
    environment: isolated-review-signing
    # `contents: write` is scoped to THIS job only (Job 1 stays contents:read) —
    # genuinely used below to commit + push the attestation-only envelope back
    # to the PR branch (RFC-0047 OQ-4), unlike AISDLC-590's unused grant.
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch (write target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pipeline-cli
        run: pnpm --filter @ai-sdlc/pipeline-cli build

      - name: Download unsigned report artifact (cross-runner transfer from sandbox-review)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: isolated-review-unsigned-report-${{ github.event.pull_request.number }}
          path: .ai-sdlc/ucvg/reports/

      # RFC-0047 §Design Details (4): patch-id is computed the same way the
      # standard attestation signer computes it (AISDLC-398 content-addressed
      # filenames — see pipeline-cli/src/attestation/patch-id.ts) so the
      # existing patch-id-keyed verifier finds this envelope unchanged.
      - name: Compute patch-id
        id: patch-id
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$PR_BASE_SHA" --depth=1 2>/dev/null || true
          PATCH_ID=$(git diff-tree --no-color -p "$PR_BASE_SHA".."$PR_HEAD_SHA" \
              -- ':!.ai-sdlc/attestations/' ':!.ai-sdlc/transcript-leaves/' ':!.ai-sdlc/transcript-leaves.jsonl' \
            | git patch-id --stable | awk '{print $1}')
          if [[ -z "$PATCH_ID" ]]; then
            echo "[isolated-review] ERROR: could not compute patch-id" >&2
            exit 1
          fi
          echo "patch_id=$PATCH_ID" >> "$GITHUB_OUTPUT"
          echo "[isolated-review] patch-id: $PATCH_ID"

      # Materialize the CI-ONLY ed25519 signing key into a 0600 temp file.
      # `AISDLC_CI_SIGNING_KEY_CONTENT` is DISTINCT from `AISDLC_SIGNING_KEY_CONTENT`
      # (the operator key used by untrusted-pr-gate.yml's Stage 4) — its private
      # half lives ONLY in this protected environment's secrets, never on any
      # operator's machine (see docs/operations/ci-only-trust-marker.md).
      - name: Materialize ci-only signing key (protected environment only)
        env:
          AISDLC_CI_SIGNING_KEY_CONTENT: ${{ secrets.AISDLC_CI_SIGNING_KEY_CONTENT }}
        run: |
          if [[ -z "$AISDLC_CI_SIGNING_KEY_CONTENT" ]]; then
            echo "[isolated-review] ERROR: AISDLC_CI_SIGNING_KEY_CONTENT secret not configured" \
              "on the isolated-review-signing environment. See docs/operations/ci-only-trust-marker.md." >&2
            exit 1
          fi
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          printf '%s' "$AISDLC_CI_SIGNING_KEY_CONTENT" > "$KEYFILE"
          echo "AISDLC_CI_SIGNING_KEY_PATH=$KEYFILE" >> "$GITHUB_ENV"

      - name: 'Clean-room sign — mint isolated-tier v6 envelope (ci-only key)'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # anchorEvidence (AISDLC-594) — AUDIT-ONLY, bound into the leaf.
          # GITHUB_RUN_ID / GITHUB_WORKFLOW_REF are GitHub Actions built-ins.
          # signerKeyId is a documented, stable identifier for this ci-only
          # key — MUST match the `machine:` (or a comment) on the corresponding
          # trusted-reviewers.yaml `ciOnly: true` entry for audit traceability.
          SIGNER_KEY_ID: ${{ vars.AI_SDLC_CI_ONLY_SIGNER_KEY_ID || 'gha-isolated-review-job' }}
          # AISDLC_CI_SIGNING_KEY_PATH is exported by the preceding step — the
          # signer resolves this key ONLY when --ci-only-key is passed (see
          # resolveSigningKeyPath({ ciOnly: true }) in
          # pipeline-cli/src/attestation/sign-v6.ts) and never falls back to
          # an operator key.
        run: |
          REPORT=".ai-sdlc/ucvg/reports/${PR_NUMBER}.unsigned.json"
          node pipeline-cli/bin/cli-ucvg.mjs clean-room-sign \
            --report-path "$REPORT" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$PR_HEAD_SHA" \
            --work-dir . \
            --patch-id "${{ steps.patch-id.outputs.patch_id }}" \
            --independence-tier isolated \
            --ci-only-key true \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --signer-key-id "$SIGNER_KEY_ID" \
            2>&1

      # Defense-in-depth: shred the materialized ci-only key. No-op on
      # ephemeral GitHub-hosted runners (the VM is destroyed), but prevents a
      # 0600 key from persisting on self-hosted / reused runners.
      - name: Cleanup ci-only signing key
        if: always()
        run: rm -f "${AISDLC_CI_SIGNING_KEY_PATH:-}"

      # RFC-0047 OQ-4 — durability: COMMIT the attestation-only envelope +
      # transcript leaf file to the PR branch (never discard on the runner,
      # the AISDLC-590 code-review MAJOR this RFC closes). Covered by the
      # AISDLC-419 attestation-only-descendant head-binding relaxation.
      - name: Commit + push isolated-tier envelope to PR branch
        env:
          PATCH_ID: ${{ steps.patch-id.outputs.patch_id }}
        run: |
          git config user.name "ai-sdlc-isolated-review[bot]"
          git config user.email "ai-sdlc-isolated-review-bot@users.noreply.github.com"

          ENVELOPE=".ai-sdlc/attestations/${PATCH_ID}.v6.dsse.json"
          LEAVES=".ai-sdlc/transcript-leaves/${PATCH_ID}.jsonl"

          if [[ ! -f "$ENVELOPE" ]]; then
            echo "[isolated-review] ERROR: expected envelope not found: $ENVELOPE" >&2
            exit 1
          fi

          git add "$ENVELOPE"
          [[ -f "$LEAVES" ]] && git add "$LEAVES"

          if git diff --cached --quiet; then
            echo "[isolated-review] nothing to commit (envelope already present at this SHA)"
            exit 0
          fi

          git commit \
            -m "chore(attestation): sign isolated-tier review (AISDLC-596)" \
            -m "Attestation-only commit (AISDLC-419 attestation-only-descendant head-binding relaxation). No source files touched."
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
