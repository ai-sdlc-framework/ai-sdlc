# Untrusted-contributor PR verification gate configuration.
#
# RFC-0043 §Stage 1 adopter-configurable settings. Loaded by
# pipeline-cli/src/pipeline/ast-gate.ts and sandbox-runner.ts.
#
# ## Deployment mode (OQ-2 resolution)
#
# `deployment: ci`    — reviewers run inside CI-side OpenShell sandbox (default).
# `deployment: local` — reviewers run inside maintainer's local OpenShell sandbox.
#
# CI mode is the default because:
#   - Hermetic isolation (ephemeral runner; no local-machine state)
#   - Signing-key distance — signing key never in the same environment that touched
#     untrusted code
#   - Contributor latency — reviewers run in parallel to the contributor's CI jobs
#
# Local opt-in is available for solo maintainers / small teams without CI sponsorship.
# Requires OpenShell installed on the maintainer's machine.

deployment: ci

# ── Stage 1: Protected-path rule engine ───────────────────────────────────────
#
# Paths matching these globs trigger `abort-protected-path` on mutation.
# Deny wins — any match aborts immediately without LLM or sandbox spin-up.
# Per RFC-0043 §Stage 1 and OQ-6 boundary principle.

protectedPaths:
  - '.github/**'
  - '**/.github/**'
  - '**/package.json'
  - '**/pnpm-lock.yaml'
  - '**/package-lock.json'
  - '**/yarn.lock'
  - '.ai-sdlc/**'
  - 'ai-sdlc-plugin/agents/**'
  - '**/*.github/workflows/**'

# Only files matching these globs may change in an untrusted PR.
# Deny wins: protected-path match takes priority over allowed-mutation match.

allowedMutationGlobs:
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.jsx'
  - '**/*.md'
  - 'sdk-python/**/*.py'
  - 'sdk-go/**/*.go'

# Content-based heuristics run on files that passed path checks.
# Per OQ-6 boundary principle: only patterns with <1% false-positive AND
# cheap-deterministic-value over downstream LLM/sandbox detection.

contentHeuristics:
  packageJsonLifecycleScripts: abort
  newGithubActionUses: abort

# ── Stage 2/3: Sandbox configuration ─────────────────────────────────────────
#
# Compute driver per OQ-5 resolution.
# docker (default) | kata | gvisor | microvm
# RFC-0022 compliance regime overrides: HIPAA / FedRAMP High / PCI-DSS Level 1
# → microvm required automatically.

sandboxDriver: docker

# AISDLC-1266: largest PR diff (bytes) that may be sent to the reviewers.
# A larger diff fails the run before any model call.
maxDiffBytes: 200000

# Resource limits per OQ-3 resolution.
# Configurable: integration/e2e suites may need higher; strict compliance may need lower.
# Breach behavior: hard abort + needs-maintainer-review label + Decision G0 routing.

differentialTest:
  resourceLimits:
    wallClockSeconds: 600
    cpuCores: 2
    memoryGb: 4
    networkDeny: true

# AISDLC-1293: extra test suites. A suite (fetch container included) starts only
# when the PR changes a file under its `paths`; the root Node suite starts only
# when the PR changes a file that belongs to no suite. Each suite uses one stock
# image pinned by digest. `fetchCommand` runs in the fetch container (network,
# base tree only, cwd = prepared copy of the base tree at /sandbox/prepared);
# `testCommand` runs in the hardened no-network run container (cwd = patched
# repo root). Dependencies are written under `node_modules/` because the run
# container links every `node_modules` from its read-only, exec-capable mount.
sandboxSuites:
  - name: python
    paths:
      - 'sdk-python/**'
    image: 'python:3.13-bookworm@sha256:cc55e4ded9c95f6ce2133b3d096db43f214d280c2a8af65d83e246c8fa7d168c'
    fetchCommand: >-
      cd sdk-python &&
      pip install --no-cache-dir --target /sandbox/prepared/node_modules/pydeps '.[dev]' &&
      rm -rf /sandbox/prepared/node_modules/pydeps/ai_sdlc
    testCommand: >-
      cd sdk-python &&
      PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/sandbox/workspace/repo/node_modules/pydeps:src
      python -m pytest -p no:cacheprovider
  - name: go
    paths:
      - 'sdk-go/**'
    image: 'golang:1.26-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0'
    fetchCommand: >-
      export GOMODCACHE=/sandbox/prepared/node_modules/gomod GOFLAGS=-modcacherw &&
      (cd sdk-go && go mod download) &&
      (cd sdk-go/operator && go mod download)
    testCommand: >-
      export GOMODCACHE=/sandbox/workspace/repo/node_modules/gomod GOPROXY=off
      GOCACHE=/tmp/gocache &&
      (cd sdk-go && go test ./... -count=1) &&
      (cd sdk-go/operator && go test ./... -count=1)
