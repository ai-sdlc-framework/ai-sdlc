# RFC-0054 "Configuration (normative)": repository conventions used by the PR
# lifecycle. Consumers read them from here; a literal in code is a defect.
# apiVersion/kind (PrLifecycle) are deliberately omitted until a schema lands:
# the generic config walk would otherwise warn "unknown kind". Readers take `spec`.
#
# Two kinds of keys exist, and only the first kind belongs in this file:
#   - Operational keys (webhook, stall, reconcile, clear, loopGuard, noTaskBranchPrefixes) are
#     read by real consumers through `loadPrLifecycleConfig`
#     (pipeline-cli/src/hierarchy/pr-lifecycle-config.ts) or `scripts/read-pr-lifecycle.mjs`;
#     the code constants are the defaults when a key is absent.
#   - Trust constants (docs-only paths, release branch prefix, task-id pattern) are NOT here.
#     The CI verifier re-derives them from code on the base ref
#     (pipeline-cli/attestation-core/docs-only-paths.mjs and the branch / task-id helpers);
#     a yaml copy a PR can edit must never be what the gate trusts.
# A test (pr-lifecycle-config.test.ts) fails when a key under `spec` has no registered reader.
spec:
  noTaskBranchPrefixes: [ai-sdlc/file-, ai-sdlc/decisions-sync, docs/]
  webhook:
    port: 8765
    debounceMs: 5000
  reconcile:
    timerOpenMs: 60000
    timerIdleMs: 900000
  stall:
    staleMs: 1800000
    graceMs: 600000
  clear:
    handshakeCeilingMs: 30000
  loopGuard:
    maxSameHeadActions: 1
